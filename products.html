<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QRVault" />
  <title>QRVault — Catálogo de Productos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>📦 Catálogo</h1>
        <p>20 productos ficticios — sólo P001 a P015 están registrados en la base de datos</p>
      </div>
      <a class="top-link" href="index.html">← Volver a Escanear</a>
      <div class="sidebar-note">
        <div class="legend">
          <span class="legend__swatch legend__swatch--registered"></span>
          <span>Registrado en la base de datos</span>
        </div>
        <div class="legend">
          <span class="legend__swatch legend__swatch--unregistered"></span>
          <span>No registrado</span>
        </div>
        <div class="stat-row">
          <span class="stat-row__label">Registrados</span>
          <span class="stat-row__value" id="registered-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row__label">No registrados</span>
          <span class="stat-row__value" id="unregistered-count">0</span>
        </div>
      </div>
      <button id="print-btn" type="button" class="btn btn--secondary">🖨️ Imprimir códigos QR</button>

      <div class="sidebar-note manage-products">
        <h2 class="card__title manage-products__title">Gestionar inventario</h2>
        <input id="new-product-code" type="text" placeholder="Código (ej. P021)" class="manual-entry__input manage-products__input" autocomplete="off" autocapitalize="characters" />
        <input id="new-product-name" type="text" placeholder="Nombre del producto" class="manual-entry__input manage-products__input" autocomplete="off" />
        <button id="add-product-btn" type="button" class="btn btn--primary">➕ Agregar al inventario</button>
      </div>
    </aside>

    <main class="content content--wide">
      <input id="search-input" type="text" placeholder="🔎 Buscar por código o nombre..." class="manual-entry__input search-input" autocomplete="off" />
      <div class="products-grid" id="products-grid"></div>
      <p id="no-results" class="install-hint hidden">No se encontraron productos que coincidan con la búsqueda.</p>
    </main>
  </div>

  <script src="js/error-handler.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/sw-update.js"></script>
</body>
</html>
