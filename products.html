<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1720" />
  <title>QRVault — Catálogo de Productos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>📦 Catálogo</h1>
        <p>20 productos ficticios — sólo P001 a P015 están registrados en la base de datos</p>
      </div>
      <a class="top-link" href="index.html">← Volver a Escanear</a>
      <div class="sidebar-note">
        <div class="legend">
          <span class="legend__swatch legend__swatch--registered"></span>
          <span>Registrado en la base de datos</span>
        </div>
        <div class="legend">
          <span class="legend__swatch legend__swatch--unregistered"></span>
          <span>No registrado</span>
        </div>
        <div class="stat-row">
          <span class="stat-row__label">Registrados</span>
          <span class="stat-row__value" id="registered-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row__label">No registrados</span>
          <span class="stat-row__value" id="unregistered-count">0</span>
        </div>
      </div>
      <button class="btn btn--secondary" onclick="window.print()">🖨️ Imprimir códigos QR</button>
    </aside>

    <main class="content content--wide">
      <div class="products-grid" id="products-grid"></div>
    </main>
  </div>

  <script src="vendor/qrcode.min.js"></script>
  <script src="js/products-data.js"></script>
  <script>
    const grid = document.getElementById('products-grid');
    let registeredCount = 0;
    let unregisteredCount = 0;

    FULL_CATALOG.forEach(product => {
      const isRegistered = REGISTERED_CODES.includes(product.code);
      isRegistered ? registeredCount++ : unregisteredCount++;

      const card = document.createElement('div');
      card.className = `product-card${isRegistered ? '' : ' product-card--unregistered'}`;

      const qr = qrcode(0, 'M');
      qr.addData(product.code);
      qr.make();
      const qrWrapper = document.createElement('div');
      qrWrapper.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
      card.appendChild(qrWrapper);

      const codeEl = document.createElement('div');
      codeEl.className = 'product-card__code';
      codeEl.textContent = product.code;
      const nameEl = document.createElement('div');
      nameEl.className = 'product-card__name';
      nameEl.textContent = product.name + (isRegistered ? '' : ' (no registrado)');
      card.appendChild(codeEl);
      card.appendChild(nameEl);
      grid.appendChild(card);
    });

    document.getElementById('registered-count').textContent = registeredCount;
    document.getElementById('unregistered-count').textContent = unregisteredCount;
  </script>
</body>
</html>
